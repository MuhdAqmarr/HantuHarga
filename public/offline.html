<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline | HargaHantu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: #E8E8E8;
      font-family: 'JetBrains Mono', monospace, system-ui;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .container {
      text-align: center;
      max-width: 24rem;
    }
    .ghost { font-size: 3rem; margin-bottom: 1rem; }
    h1 {
      font-size: 1.25rem;
      color: #00FF88;
      margin-bottom: 0.5rem;
      letter-spacing: 0.1em;
    }
    p {
      font-size: 0.875rem;
      color: #999;
      line-height: 1.6;
    }
    .retry {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1.5rem;
      border: 1px solid #00FF88;
      color: #00FF88;
      border-radius: 0.375rem;
      text-decoration: none;
      font-size: 0.875rem;
      cursor: pointer;
      background: transparent;
    }
    .retry:hover { background: rgba(0, 255, 136, 0.1); }
  </style>
</head>
<body>
  <div class="container">
    <div class="ghost" aria-hidden="true">👻</div>
    <h1>SIGNAL LOST</h1>
    <p>You appear to be offline. HargaHantu needs an internet connection to fetch the latest price intel.</p>
    <button class="retry" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
